name: Server CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app ml_runtime tools tests --select F --exclude practice_static_errors.py
      - run: pytest -q
      - run: pip-audit --progress-spinner off
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration-check.db

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compost_test
          POSTGRES_PASSWORD: compost_test
          POSTGRES_DB: compost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compost_test -d compost_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://compost_test:compost_test@localhost:5432/compost_test
