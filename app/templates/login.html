<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ComPost · Вход</title><link rel="stylesheet" href="/static/admin.css?v=8"></head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-mark">C</div>
    <p class="eyebrow">COMMUNITY COMPOST</p>
    <h1>Панель команды</h1>
    <p class="muted">Администрирование, модерация и состояние оборудования в одном месте.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button>Войти в панель</button>
    </form>
  </main>
</body>
</html>
