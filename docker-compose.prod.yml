name: compost

x-common: &common
  restart: unless-stopped
  networks: [compost]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    <<: *common
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]

  telemetry-postgres:
    <<: *common
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [telemetry-data:/var/lib/postgresql/data]

  minio:
    <<: *common
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [minio-data:/data]

  minio-init:
    <<: *common
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} && mc mb --ignore-existing local/compost-photos"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}

  firmware-storage:
    <<: *common
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9100
    environment:
      MINIO_ROOT_USER: ${FIRMWARE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FIRMWARE_S3_SECRET_KEY}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [firmware-data:/data]

  firmware-storage-init:
    <<: *common
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      firmware-storage: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set firmware http://firmware-storage:9100 $${FIRMWARE_S3_ACCESS_KEY} $${FIRMWARE_S3_SECRET_KEY} && mc mb --ignore-existing firmware/compost-firmware"]
    environment:
      FIRMWARE_S3_ACCESS_KEY: ${FIRMWARE_S3_ACCESS_KEY}
      FIRMWARE_S3_SECRET_KEY: ${FIRMWARE_S3_SECRET_KEY}

  ml-service:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.ml
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment: &s3-environment
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: compost-photos
    depends_on:
      minio-init: {condition: service_completed_successfully}
    volumes: [ml-model-cache:/home/compost/.cache]
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  ml-trainer:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.ml-train
    cap_drop: [ALL]
    entrypoint: ["python", "-m", "tools.ml_worker"]
    environment:
      <<: *s3-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ML_BASE_MODEL: ${ML_BASE_MODEL:-yolo26n.pt}
      ML_EPOCHS: ${ML_EPOCHS:-60}
      ML_IMAGE_SIZE: ${ML_IMAGE_SIZE:-640}
      ML_CONFIDENCE: ${ML_CONFIDENCE:-0.35}
      ML_TACO_PRETRAIN: ${ML_TACO_PRETRAIN:-true}
      ML_TACO_ROOT: /home/compost/.cache/compost/taco
      ML_TACO_EPOCHS: ${ML_TACO_EPOCHS:-30}
      ML_TACO_DOWNLOAD_WORKERS: ${ML_TACO_DOWNLOAD_WORKERS:-8}
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: [ml-cache:/home/compost/.cache]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: {cpus: "6.0", memory: 12G}

  api:
    <<: *common
    build: .
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.api_service:app --host 0.0.0.0 --port 8000"]
    environment:
      ENVIRONMENT: production
      PYTHONDONTWRITEBYTECODE: "1"
      AUTO_CREATE_SCHEMA: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: compost-photos
      FIRMWARE_S3_ENDPOINT: http://firmware-storage:9100
      FIRMWARE_S3_ACCESS_KEY: ${FIRMWARE_S3_ACCESS_KEY}
      FIRMWARE_S3_SECRET_KEY: ${FIRMWARE_S3_SECRET_KEY}
      FIRMWARE_S3_BUCKET: compost-firmware
      ML_SERVICE_URL: http://ml-service:8001
      MEDIA_SERVICE_URL: http://media-service:8003
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN}
      TELEMETRY_SERVICE_URL: http://telemetry-service:8004
      TELEMETRY_INTERNAL_TOKEN: ${TELEMETRY_INTERNAL_TOKEN}
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      firmware-storage-init: {condition: service_completed_successfully}
      ml-service: {condition: service_healthy}
      media-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  web:
    <<: *common
    build: .
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["uvicorn", "app.web_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: production
      PYTHONDONTWRITEBYTECODE: "1"
      AUTO_CREATE_SCHEMA: "false"
      COOKIE_SECURE: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: compost-photos
      FIRMWARE_S3_ENDPOINT: http://firmware-storage:9100
      FIRMWARE_S3_ACCESS_KEY: ${FIRMWARE_S3_ACCESS_KEY}
      FIRMWARE_S3_SECRET_KEY: ${FIRMWARE_S3_SECRET_KEY}
      FIRMWARE_S3_BUCKET: compost-firmware
      ML_SERVICE_URL: http://ml-service:8001
      MEDIA_SERVICE_URL: http://media-service:8003
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN}
      TELEMETRY_SERVICE_URL: http://telemetry-service:8004
      TELEMETRY_INTERNAL_TOKEN: ${TELEMETRY_INTERNAL_TOKEN}
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}

  media-service:
    <<: *common
    build: .
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["uvicorn", "media_service:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: compost-photos
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN}
    depends_on:
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  telemetry-service:
    <<: *common
    build: .
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["uvicorn", "telemetry_service:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      TELEMETRY_DATABASE_URL: postgresql+psycopg://telemetry:${TELEMETRY_POSTGRES_PASSWORD}@telemetry-postgres:5432/telemetry
      TELEMETRY_INTERNAL_TOKEN: ${TELEMETRY_INTERNAL_TOKEN}
    depends_on:
      telemetry-postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  telemetry-worker:
    <<: *common
    build: .
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-m", "tools.telemetry_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEMETRY_SERVICE_URL: http://telemetry-service:8004
      TELEMETRY_INTERNAL_TOKEN: ${TELEMETRY_INTERNAL_TOKEN}
    depends_on:
      api: {condition: service_healthy}
      telemetry-service: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  caddy:
    <<: *common
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      DOMAIN: ${DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.28.0
    cap_drop: [ALL]
    read_only: true
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}

  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.3
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets-http.yml:/etc/prometheus/targets-http.yml:ro
      - ./monitoring/targets-tcp.prod.yml:/etc/prometheus/targets-tcp.yml:ro
      - prometheus-data:/prometheus
    depends_on: [blackbox-exporter]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

  grafana:
    <<: *common
    image: grafana/grafana:13.2.2
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

networks:
  compost:

volumes:
  postgres-data:
  telemetry-data:
  minio-data:
  firmware-data:
  ml-cache:
  ml-model-cache:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
