services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compost
      POSTGRES_USER: compost
      POSTGRES_PASSWORD: compost-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compost"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/compost-photos"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://compost:compost-local@postgres:5432/compost
      JWT_SECRET: local-compose-secret-change-in-production
      S3_PUBLIC_ENDPOINT: http://192.168.1.212:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  ml-service:
    build: .
    command: ["uvicorn", "ml_service:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  minio-data:
