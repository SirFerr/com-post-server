services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compost
      POSTGRES_USER: compost
      POSTGRES_PASSWORD: compost-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compost"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/compost-photos"]
  firmware-storage:
    image: minio/minio:latest
    command: server /data --address :9100 --console-address :9101
    environment:
      MINIO_ROOT_USER: firmwareadmin
      MINIO_ROOT_PASSWORD: firmware-local-secret
      MC_HOST_local: http://firmwareadmin:firmware-local-secret@localhost:9100
    ports: ["9100:9100", "9101:9101"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [firmware-data:/data]
  firmware-storage-init:
    image: minio/mc:latest
    depends_on:
      firmware-storage: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set firmware http://firmware-storage:9100 firmwareadmin firmware-local-secret && mc mb --ignore-existing firmware/compost-firmware"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://compost:compost-local@postgres:5432/compost
      JWT_SECRET: local-compose-secret-change-in-production
      S3_PUBLIC_ENDPOINT: http://192.168.1.212:9000
      ML_SERVICE_URL: http://ml-service:8001
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      firmware-storage-init: {condition: service_completed_successfully}
      ml-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: ["uvicorn", "ml_service:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile.ml-train
    entrypoint: ["python", "-m", "tools.ml_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://compost:compost-local@postgres:5432/compost
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: compost-photos
      ML_BASE_MODEL: yolo26n.pt
      ML_EPOCHS: 60
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    restart: unless-stopped
    volumes: [ml-cache:/root/.cache]
volumes:
  postgres-data:
  minio-data:
  firmware-data:
  ml-cache:
